<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squishy voice studio</title><link rel="stylesheet" href="assets/fonts/fonts.css"><link rel="stylesheet" href="styles.css?v=tts-10"><script src="tutor-config.js" defer></script><script src="voice.js" defer></script></head>
<body><main class="wrap" style="max-width:700px"><a href="index.html">← Back to Math Game</a><section class="math-help" style="margin-top:20px"><h1 style="font-size:36px">Squishy voice studio</h1><p>Try a playful, childlike squishy voice. This voice is AI-generated.</p><form id="voice-form" class="voice-form"><label for="voice-choice">Voice</label><select id="voice-choice"><option value="coral">Coral · starting voice</option><option value="shimmer">Shimmer</option><option value="nova">Nova</option><option value="marin">Marin</option></select><label for="voice-text">Words to say</label><textarea id="voice-text" maxlength="1000" rows="5" required>Hi! I’m your squishy guide. Choose a math topic, then pick No timer if you want time to think. Ready? Let’s reveal a surprise!</textarea><label for="voice-code">Family access code</label><input id="voice-code" type="password" autocomplete="off" required placeholder="Ask a parent for the code"><button id="voice-generate" class="primary" type="submit">Generate voice</button></form><p class="help-note">Generation uses API credits and the shared family allowance. Replay is free.</p><p id="voice-status" role="status"></p><audio id="voice-player" controls hidden style="width:100%"></audio><a id="voice-save" download="squishy-sample.mp3" hidden>Download this sample</a></section></main></body></html>
